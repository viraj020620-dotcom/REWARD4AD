<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earn Rewards</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Adsgram SDK -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      background: #0f172a;
      color: #ffffff;
      padding: 20px;
      margin: 0;
    }
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid #334155;
    }
    .coin-val {
      font-size: 38px;
      font-weight: 800;
      color: #38bdf8;
      margin: 6px 0;
    }
    .inr-val {
      font-size: 15px;
      color: #94a3b8;
    }
    .btn {
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 10px;
      width: 100%;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:active {
      transform: scale(0.98);
      background: #0369a1;
    }
    .btn-secondary {
      background: #334155;
    }
    .input-box {
      width: 90%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      box-sizing: border-box;
      font-size: 14px;
    }
    .info {
      font-size: 12px;
      color: #64748b;
      margin-top: 14px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div style="font-size: 12px; letter-spacing: 1px; color: #94a3b8;">YOUR BALANCE</div>
    <div class="coin-val" id="coins">0</div>
    <div class="inr-val">≈ ₹<span id="inr">0.00</span></div>
  </div>

  <button class="btn" onclick="watchAd()">▶ Watch Video Ad (+5 Coins)</button>

  <div class="card" style="margin-top: 20px;">
    <div style="font-weight: 600; margin-bottom: 8px;">Redeem Cash (UPI)</div>
    <input type="text" id="upiId" class="input-box" placeholder="example@upi">
    <button class="btn btn-secondary" onclick="requestWithdrawal()">Request ₹50 Payout</button>
  </div>

  <p class="info">100 Coins = ₹1.00 • Min. Withdrawal: 5,000 Coins (₹50)</p>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let balance = parseInt(localStorage.getItem("user_coins") || "0");
    updateDisplay();

    // Your active Adsgram Block ID
    const AdController = window.Adsgram.init({ blockId: "45875" });

    // Your Google Script Webhook URL
    const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbwt_sO9EE438kFhhoArCDllPZR9xxNZnkJSg1GZaVmv_YWZT-hL3QXqoCQVzaHXFof0/exec";

    function watchAd() {
      AdController.show()
        .then((result) => {
          balance += 5;
          localStorage.setItem("user_coins", balance);
          updateDisplay();
          tg.showAlert("Success! 5 Coins added.");
        })
        .catch((error) => {
          tg.showAlert("Ad still under moderation or loading. Try again in a little while.");
        });
    }

    function requestWithdrawal() {
      const upi = document.getElementById("upiId").value.trim();
      const userId = tg.initDataUnsafe.user?.id || "DemoUser";
      const username = tg.initDataUnsafe.user?.username || "NoUsername";

      if (!upi || !upi.includes("@")) {
        tg.showAlert("Please enter a valid UPI ID (e.g. mobile@upi).");
        return;
      }
      if (balance < 5000) {
        tg.showAlert("Minimum balance required is 5,000 Coins (₹50). Keep watching ads!");
        return;
      }

      fetch(WEBHOOK_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userId: userId, username: username, upi: upi, inr: 50 })
      }).then(() => {
        balance -= 5000;
        localStorage.setItem("user_coins", balance);
        updateDisplay();
        document.getElementById("upiId").value = "";
        tg.showAlert("Withdrawal request submitted! Payout will be sent to your UPI address.");
      }).catch((err) => {
        tg.showAlert("Network error. Please try again.");
      });
    }

    function updateDisplay() {
      document.getElementById("coins").innerText = balance;
      document.getElementById("inr").innerText = (balance / 100).toFixed(2);
    }
  </script>
</body>
</html>
