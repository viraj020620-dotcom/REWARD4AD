<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>REWARD4AD</title>
    <!-- Telegram & Adsgram SDKs -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary2: #818cf8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #080b14;
            --surface: #101522;
            --surface2: #171d2b;
            --surface3: #20283a;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --shadow: 0 10px 35px rgba(0, 0, 0, 0.20);
        }

        body.light {
            --bg: #f4f6fb;
            --surface: #ffffff;
            --surface2: #f1f4f9;
            --surface3: #e8edf5;
            --text: #111827;
            --muted: #64748b;
            --border: rgba(15, 23, 42, 0.08);
            --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: calc(12px + env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom));
            transition: background 0.25s ease, color 0.25s ease;
        }

        button, input { font: inherit; }
        button { cursor: pointer; }

        .app { max-width: 600px; margin: auto; }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 4px 18px;
        }

        .profile-mini {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary), var(--primary2));
            color: #fff;
            font-weight: 900;
            font-size: 17px;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.25);
        }

        .user-name { font-size: 14px; font-weight: 850; }
        .user-id { margin-top: 2px; color: var(--muted); font-size: 10px; }

        .live {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--success);
            font-size: 10px;
            font-weight: 850;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 0 5px rgba(16, 185, 129, 0.08);
            animation: pulse 1.8s infinite;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 12px;
        }

        .card-pad { padding: 17px; }

        .balance {
            position: relative;
            overflow: hidden;
            padding: 21px;
            background: radial-gradient(circle at 90% 0%, rgba(99, 102, 241, 0.20), transparent 35%), var(--surface);
        }

        .balance-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .label {
            color: var(--muted);
            font-size: 10px;
            font-weight: 850;
            letter-spacing: 1px;
        }

        .status {
            background: rgba(16, 185, 129, 0.12);
            color: var(--success);
            border-radius: 20px;
            padding: 5px 9px;
            font-size: 9px;
            font-weight: 850;
        }

        .money {
            margin-top: 8px;
            font-size: 38px;
            line-height: 1;
            font-weight: 950;
            letter-spacing: -1.5px;
        }

        .money span {
            color: var(--muted);
            font-size: 15px;
            font-weight: 750;
        }

        .coins-line {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 7px;
            color: var(--success);
            font-size: 12px;
            font-weight: 800;
        }

        .progress {
            height: 8px;
            margin-top: 18px;
            background: var(--surface3);
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--primary), var(--success));
            transition: width 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-top: 7px;
            color: var(--muted);
            font-size: 10px;
            font-weight: 700;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 9px;
            margin-bottom: 12px;
        }

        .stat {
            padding: 14px 10px;
            text-align: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 17px;
        }

        .stat-value { font-size: 17px; font-weight: 900; }
        .stat-label { margin-top: 4px; color: var(--muted); font-size: 9px; font-weight: 700; }

        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 19px 3px 9px;
        }

        .section-title h2 { font-size: 13px; font-weight: 900; }
        .section-title span { color: var(--muted); font-size: 10px; }

        .action {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 17px;
            background: var(--surface);
            color: var(--text);
            text-align: left;
            margin-bottom: 9px;
            transition: transform 0.15s ease, background 0.2s ease;
        }

        .action:active { transform: scale(0.975); }
        .action:disabled { opacity: 0.6; cursor: not-allowed; }

        .action-icon {
            flex: 0 0 43px;
            width: 43px;
            height: 43px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 13px;
            background: var(--surface2);
            font-size: 19px;
        }

        .action-main { flex: 1; }
        .action-title { font-size: 13px; font-weight: 850; }
        .action-sub { color: var(--muted); margin-top: 3px; font-size: 10px; line-height: 1.35; }

        .reward {
            white-space: nowrap;
            padding: 6px 9px;
            border-radius: 10px;
            background: rgba(16, 185, 129, 0.11);
            color: var(--success);
            font-size: 10px;
            font-weight: 900;
        }

        .primary-btn {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary2));
            color: #fff;
            font-size: 13px;
            font-weight: 900;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.20);
            transition: transform 0.15s ease;
        }

        .primary-btn:active { transform: scale(0.97); }
        .primary-btn:disabled { opacity: 0.55; cursor: not-allowed; }

        .ref-card {
            padding: 17px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.13), rgba(16, 185, 129, 0.06)), var(--surface);
        }

        .ref-link {
            display: flex;
            gap: 7px;
            margin-top: 12px;
        }

        .ref-link input {
            min-width: 0;
            flex: 1;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 11px;
            background: var(--surface2);
            color: var(--text);
            outline: none;
            font-size: 11px;
        }

        .copy-btn {
            border: none;
            padding: 0 14px;
            border-radius: 12px;
            background: var(--primary);
            color: #fff;
            font-size: 11px;
            font-weight: 850;
            cursor: pointer;
        }

        .steps {
            display: grid;
            gap: 8px;
            margin-top: 13px;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 9px;
            color: var(--muted);
            font-size: 10px;
            font-weight: 700;
        }

        .step-number {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--surface3);
            color: var(--text);
            font-size: 9px;
            font-weight: 900;
        }

        .step.done { color: var(--success); }
        .step.done .step-number {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }

        .wallet-card { text-align: center; padding: 22px; }
        .wallet-amount { margin-top: 7px; font-size: 35px; font-weight: 950; }

        .input-label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 10px; font-weight: 800; }

        .input {
            width: 100%;
            padding: 13px;
            border: 1px solid var(--border);
            border-radius: 13px;
            outline: none;
            background: var(--surface2);
            color: var(--text);
            font-size: 13px;
        }

        .input:focus { border-color: var(--primary); }

        .withdraw-status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px;
            border-radius: 14px;
            background: var(--surface2);
            margin-top: 10px;
        }

        .status-icon {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: rgba(245, 158, 11, 0.12);
            font-size: 16px;
        }

        .status-title { font-size: 11px; font-weight: 850; }
        .status-sub { color: var(--muted); margin-top: 2px; font-size: 9px; }

        .profile-card { padding: 20px; }

        .profile-big {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .profile-avatar {
            width: 58px;
            height: 58px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary), var(--primary2));
            color: #fff;
            font-size: 23px;
            font-weight: 950;
        }

        .profile-name { font-size: 17px; font-weight: 900; }
        .profile-id { margin-top: 3px; color: var(--muted); font-size: 10px; }

        .setting {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 2px;
            border-bottom: 1px solid var(--border);
        }

        .setting:last-child { border-bottom: 0; }

        .setting-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .setting-icon {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: var(--surface2);
        }

        .setting-title { font-size: 12px; font-weight: 800; }
        .setting-sub { margin-top: 2px; color: var(--muted); font-size: 9px; }

        .toggle {
            width: 46px;
            height: 26px;
            padding: 3px;
            border: 0;
            border-radius: 20px;
            background: var(--surface3);
            cursor: pointer;
        }

        .toggle::after {
            content: "";
            display: block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #fff;
            transition: transform 0.2s;
        }

        body.light .toggle { background: var(--primary); }
        body.light .toggle::after { transform: translateX(20px); }

        .bottom-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 100;
            height: calc(68px + env(safe-area-inset-bottom));
            padding: 5px 7px env(safe-area-inset-bottom);
            display: flex;
            align-items: flex-start;
            justify-content: space-around;
            background: color-mix(in srgb, var(--surface) 94%, transparent);
            backdrop-filter: blur(18px);
            border-top: 1px solid var(--border);
        }

        .nav-item {
            flex: 1;
            height: 58px;
            border: 0;
            background: none;
            color: var(--muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            font-size: 9px;
            font-weight: 850;
            transition: color 0.2s, transform 0.15s;
            cursor: pointer;
        }

        .nav-item:active { transform: scale(0.92); }
        .nav-item.active { color: var(--primary2); }

        .nav-icon { font-size: 18px; line-height: 18px; }

        .tab {
            display: none;
            animation: fadeIn 0.25s ease;
        }

        .tab.active { display: block; }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 86px;
            z-index: 300;
            transform: translate(-50%, 20px) scale(0.95);
            opacity: 0;
            pointer-events: none;
            min-width: 220px;
            padding: 12px 15px;
            border-radius: 14px;
            background: #111827;
            color: #fff;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
            text-align: center;
            font-size: 11px;
            font-weight: 850;
            transition: opacity 0.25s, transform 0.25s;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0) scale(1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            50% { opacity: 0.45; }
        }
    </style>
</head>
